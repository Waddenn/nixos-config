name: "CI"
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.mode.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: mode
        name: Select validation level
        env:
          FULL_CI: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        run: echo "full=$FULL_CI" >> "$GITHUB_OUTPUT"
      - name: Check patch whitespace
        run: git show --format= --check HEAD
      - name: Run policy tests without Nix or infrastructure access
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check shell scripts
        run: shellcheck scripts/deploy-fleet.sh scripts/fleet-status.sh scripts/pull-update-host.sh scripts/update-caddy-plugin-hash.sh

  deployment-tests:
    needs: quick-checks
    if: needs.quick-checks.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - run: nix build --no-link .#checks.x86_64-linux.deployment-scripts .#checks.x86_64-linux.fleet-inventory .#checks.x86_64-linux.beszel-agent
      - run: python3 scripts/check-beszel-hub.py
      - run: python3 scripts/check-colmena.py

  check-formatting:
    needs: quick-checks
    if: needs.quick-checks.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: DeterminateSystems/magic-nix-cache-action@v7
    - name: Check Formatting
      run: nix fmt -- --check

  generate-matrix:
    needs: quick-checks
    if: needs.quick-checks.outputs.full == 'true'
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-matrix.outputs.hosts }}
      has-builds: ${{ steps.set-matrix.outputs.has-builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v25
      - id: set-matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/plan-ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json

  flake-check:
    needs: generate-matrix
    if: needs.generate-matrix.outputs.has-builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.generate-matrix.outputs.hosts) }}
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: DeterminateSystems/magic-nix-cache-action@v7
    - name: Flake Check ${{ matrix.host }}
      run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  validation:
    if: always() && needs.quick-checks.outputs.full == 'true'
    needs: [quick-checks, deployment-tests, check-formatting, generate-matrix, flake-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks and every selected build
        env:
          QUICK: ${{ needs.quick-checks.result }}
          TESTS: ${{ needs.deployment-tests.result }}
          FORMAT: ${{ needs.check-formatting.result }}
          PLAN: ${{ needs.generate-matrix.result }}
          BUILDS: ${{ needs.flake-check.result }}
          HAS_BUILDS: ${{ needs.generate-matrix.outputs.has-builds }}
        run: |
          test "$QUICK" = success
          test "$TESTS" = success
          test "$FORMAT" = success
          test "$PLAN" = success
          if [ "$HAS_BUILDS" = true ]; then
            test "$BUILDS" = success
          else
            test "$HAS_BUILDS" = false
            test "$BUILDS" = skipped
          fi

  promote-update:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/update-flake-lock'
    needs: [validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.sha;
            const branch = 'update-flake-lock';
            const {data: prs} = await github.rest.pulls.list({owner, repo,
              state: 'open', base: 'main', head: `${owner}:${branch}`});
            if (prs.length !== 1) throw new Error('Expected exactly one update PR');
            const pr = prs[0];
            if (pr.user.login !== 'github-actions[bot]' || pr.head.sha !== sha ||
                pr.head.repo.full_name !== `${owner}/${repo}`) {
              throw new Error('Update identity or tested revision changed');
            }
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number: pr.number, per_page: 100});
            const allowed = new Set(['flake.lock', 'lib/container-images.json', 'lib/beszel-release.json',
              'modules/services/networking/caddy-plugin-hash.txt']);
            if (!files.length || files.some(f => !allowed.has(f.filename) ||
                f.status !== 'modified')) throw new Error('Unexpected update files');
            // Preserve the tested SHA. A concurrent divergent main fails safely.
            await github.rest.git.updateRef({owner, repo, ref: 'heads/main', sha, force: false});
            // Token pushes do not trigger push workflows. Validate main explicitly.
            await github.rest.actions.createWorkflowDispatch({owner, repo,
              workflow_id: 'ci.yml', ref: 'main'});
