name: Update Flake Lock

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependency-update
  cancel-in-progress: false

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Use shared Cachix cache
        # cachix-action v17
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: waddenn-nixos
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Update flake.lock
        run: nix flake update

      - name: Refresh Caddy plugin hash
        run: ./scripts/update-caddy-plugin-hash.sh

      - name: Pin container images
        run: nix shell nixpkgs#skopeo --command python3 scripts/update-container-images.py

      - name: Pin matching Beszel hub and agent
        run: nix shell nixpkgs#skopeo --command python3 scripts/update-beszel.py

      - name: Check formatting
        run: nix fmt -- --check

      - name: Evaluate all hosts
        run: nix flake check --no-build --print-build-logs

      - name: Check deployment scripts
        run: nix build --no-link .#checks.x86_64-linux.deployment-scripts

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake.lock"
          title: "Update flake.lock"
          body: |
            Automated update of flake inputs and pinned container image digests.

            This PR was created automatically by the `update-flake` workflow.
          branch: update-flake-lock
          delete-branch: true

      # GITHUB_TOKEN-created PR runs require approval; explicit dispatch does not.
      - name: Validate update for automatic promotion
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref update-flake-lock
