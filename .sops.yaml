    key_groups:
      - age: [*primary, *workstation, *caddy]
  - path_regex: ^secrets/authelia\.yaml$
    key_groups:
      - age: [*primary, *workstation, *authelia]
  - path_regex: ^secrets/immich\.yaml$
    key_groups:
      - age: [*primary, *workstation, *immich]
  - path_regex: ^secrets/controller\.yaml$
    key_groups:
      - age: [*primary, *workstation, *dev-nixos]
  - path_regex: ^secrets/gatus\.yaml$
    key_groups:
      - age: [*primary, *workstation, *gatus]
  - path_regex: ^secrets/operator\.yaml$
    key_groups:
      - age: [*primary, *workstation]
  - path_regex: ^secrets/[^/]+\.(yaml|json|env|ini)(\.enc)?$
