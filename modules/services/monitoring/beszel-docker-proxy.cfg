global
  maxconn 32

defaults
  mode http
  timeout connect 3s
  timeout client 15s
  timeout server 15s

frontend beszel
  bind /run/beszel-docker-proxy/docker.sock mode 660
  # No create, exec, start/stop, filesystem archive, build or plugin API.
  # Keep container inspection and logs used by the Beszel dashboard.
  acl read_method method GET HEAD
  acl read_path path_reg ^/(v[0-9]+\.[0-9]+/)?(_ping|version|info|containers/json|containers/[a-fA-F0-9]{12,64}/(json|stats|logs))$
  http-request deny deny_status 403 unless read_method read_path
  default_backend docker

backend docker
  server engine /run/docker.sock
